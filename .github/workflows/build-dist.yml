name: Build and commit JS dist

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.kt'
      - 'build.gradle.kts'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Build JS distribution
        run: ./gradlew jsBrowserProductionLibraryDistribution

      - name: Commit updated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/dist/js/productionLibrary/
          git diff --cached --quiet || git commit -m "chore: rebuild JS dist [skip ci]"
          git push
